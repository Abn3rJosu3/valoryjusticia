<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Valor & Justicia</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #c5a059;
            --border-color: #334155;
            --error-red: #f87171;
            --btn-blue: #2563eb;
            --btn-blue-hover: #1d4ed8;
            --btn-green: #16a34a;
            --btn-green-hover: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: var(--accent-gold);
            color: #000;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sistema de pestañas */
        .nav-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn.active {
            background-color: var(--btn-blue);
            color: #fff;
            border-color: var(--btn-blue);
        }

        .tab-btn:hover:not(.active) {
            background-color: #334155;
            color: var(--text-main);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
        }

        .btn-action {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s;
        }

        .btn-action:hover {
            background-color: var(--btn-green-hover);
        }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: var(--accent-gold);
            padding: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge-area {
            background: rgba(197, 160, 89, 0.15);
            color: var(--accent-gold);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .badge-status {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Estilos del Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        .modal-content h2 {
            margin-bottom: 1rem;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--btn-blue);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-balance-scale"></i> Valor & Justicia - Panel
        </div>
        <div class="user-info">
            <span id="welcomeMsg">Cargando usuario...</span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <!-- Pestañas de Navegación del Panel -->
        <div class="nav-tabs">
            <button onclick="cambiarVista('mensajes')" id="btnTabMensajes" class="tab-btn active">
                <i class="fas fa-envelope"></i> Mensajes Recibidos
            </button>
            <button onclick="cambiarVista('expedientes')" id="btnTabExpedientes" class="tab-btn">
                <i class="fas fa-folder-open"></i> Gestión de Expedientes
            </button>
        </div>

        <!-- SECCIÓN 1: MENSAJES DE CONTACTO -->
        <div id="seccionMensajes">
            <h1>Mensajes de Contacto Recibidos</h1>
            <div class="table-container" style="margin-top: 1.5rem;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Teléfono / Email</th>
                            <th>Área</th>
                            <th>Mensaje</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContactos">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">
                                Cargando mensajes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SECCIÓN 2: GESTIÓN DE EXPEDIENTES (Oculta por defecto) -->
        <div id="seccionExpedientes" class="hidden">
            <div class="section-header">
                <h1>Expedientes Legales Activos</h1>
                <button onclick="abrirModalExpediente()" class="btn-action">
                    <i class="fas fa-plus"></i> Nuevo Expediente
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No. Expediente</th>
                            <th>Cliente</th>
                            <th>Abogado Asignado</th>
                            <th>Estado</th>
                            <th>Fecha de Creación</th>
                        </tr>
                    </thead>
                    <tbody id="tablaExpedientesBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted);">
                                Cargando expedientes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- VENTANA MODAL PARA NUEVO EXPEDIENTE -->
    <div id="modalExpediente" class="modal-overlay">
        <div class="modal-content">
            <h2>Registrar Nuevo Expediente</h2>
            
            <form id="formExpediente" onsubmit="guardarExpediente(event)">
                <div class="form-group">
                    <label>No. de Expediente:</label>
                    <input type="text" id="numExp" required placeholder="Ej. EXP-2026-001">
                </div>

                <div class="form-group">
                    <label>Nombre del Cliente:</label>
                    <input type="text" id="clienteExp" required placeholder="Nombre completo">
                </div>

                <div class="form-group">
                    <label>Abogado Responsable:</label>
                    <input type="text" id="abogadoExp" required placeholder="Ej. Licda. María Morales">
                </div>

                <div class="form-group">
                    <label>Estado del Caso:</label>
                    <select id="estadoExp">
                        <option value="En Trámite">En Trámite</option>
                        <option value="Audiencia Pendiente">Audiencia Pendiente</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Archivado">Archivado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción / Notas:</label>
                    <textarea id="descExp" rows="3" placeholder="Detalles iniciales del caso..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="cerrarModalExpediente()">Cancelar</button>
                    <button type="submit" class="btn-submit">Guardar Expediente</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Escapar texto para prevenir vulnerabilidades XSS
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Validar sesión antes de cargar la página
        const abogadoData = JSON.parse(sessionStorage.getItem('abogado'));
        if (!abogadoData) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeMsg').textContent = `Bienvenido, ${abogadoData.nombre}`;
        }

        // Control de pestañas visuales
        function cambiarVista(vista) {
            const secMensajes = document.getElementById('seccionMensajes');
            const secExpedientes = document.getElementById('seccionExpedientes');
            const btnMensajes = document.getElementById('btnTabMensajes');
            const btnExpedientes = document.getElementById('btnTabExpedientes');

            if (vista === 'mensajes') {
                secMensajes.classList.remove('hidden');
                secExpedientes.classList.add('hidden');
                btnMensajes.classList.add('active');
                btnExpedientes.classList.remove('active');
            } else {
                secMensajes.classList.add('hidden');
                secExpedientes.classList.remove('hidden');
                btnExpedientes.classList.add('active');
                btnMensajes.classList.remove('active');
                cargarExpedientes();
            }
        }

        // Funciones para manejar el Modal de Expedientes
        function abrirModalExpediente() {
            document.getElementById('modalExpediente').style.display = 'flex';
        }

        function cerrarModalExpediente() {
            document.getElementById('modalExpediente').style.display = 'none';
            document.getElementById('formExpediente').reset();
        }

        // Cargar solicitudes de contacto desde Node.js/Oracle
        async function cargarContactos() {
            const tbody = document.getElementById('tablaContactos');
            try {
                const res = await fetch('/api/contactos');
                if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);

                const result = await res.json();

                if (result.success) {
                    tbody.innerHTML = '';
                    const registros = result.data || [];

                    if (registros.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-muted);">
                                    No hay solicitudes de contacto registradas.
                                </td>
                            </tr>`;
                        return;
                    }

                    registros.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${escapeHtml(item.id)}</td>
                            <td><small style="color: var(--text-muted);">${escapeHtml(item.fecha || 'N/A')}</small></td>
                            <td><strong>${escapeHtml(item.nombre)}</strong></td>
                            <td>
                                <div>${escapeHtml(item.telefono || 'N/A')}</div>
                                <small style="color: var(--text-muted);">${escapeHtml(item.email || 'N/A')}</small>
                            </td>
                            <td><span class="badge-area">${escapeHtml(item.area || 'General')}</span></td>
                            <td>${escapeHtml(item.mensaje)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    throw new Error(result.message || 'Error al obtener datos');
                }
            } catch (err) {
                console.error('Error al cargar contactos:', err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--error-red);">
                            Error al cargar los mensajes desde el servidor.
                        </td>
                    </tr>`;
            }
        }

        // Cargar expedientes desde Node.js/Oracle
        async function cargarExpedientes() {
            const tbody = document.getElementById('tablaExpedientesBody');
            try {
                const res = await fetch('/api/expedientes');
                if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);

                const result = await res.json();

                if (result.success) {
                    tbody.innerHTML = '';
                    const expedientes = result.data || [];

                    if (expedientes.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">
                                    No hay expedientes activos registrados.
                                </td>
                            </tr>`;
                        return;
                    }

                    expedientes.forEach(exp => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong style="color: var(--accent-gold);">${escapeHtml(exp.numeroExpediente)}</strong></td>
                            <td>${escapeHtml(exp.cliente)}</td>
                            <td>${escapeHtml(exp.abogadoResponsable)}</td>
                            <td><span class="badge-status">${escapeHtml(exp.estado)}</span></td>
                            <td><small style="color: var(--text-muted);">${escapeHtml(exp.fecha || 'N/A')}</small></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    throw new Error(result.message || 'Error al obtener expedientes');
                }
            } catch (err) {
                console.error('Error al cargar expedientes:', err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--error-red);">
                            Error al cargar los expedientes desde el servidor.
                        </td>
                    </tr>`;
            }
        }

        // Enviar datos del nuevo expediente a Node.js
        async function guardarExpediente(event) {
            event.preventDefault();

            const data = {
                numeroExpediente: document.getElementById('numExp').value,
                cliente: document.getElementById('clienteExp').value,
                abogadoResponsable: document.getElementById('abogadoExp').value,
                estado: document.getElementById('estadoExp').value,
                descripcion: document.getElementById('descExp').value
            };

            try {
                const res = await fetch('/api/expedientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    alert('¡Expediente registrado con éxito!');
                    cerrarModalExpediente();
                    cargarExpedientes(); // Recarga la tabla automáticamente
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error('Error al guardar el expediente:', err);
                alert('Error de conexión con el servidor.');
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('abogado');
            window.location.href = 'index.html';
        }

        // Iniciar carga de datos iniciales al abrir el panel
        cargarContactos();
    </script>
</body>
</html>
